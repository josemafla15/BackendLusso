{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!--
  BLOQUE: Página "¿Y si este viaje es el que recuerdes toda tu vida?" — Lusso Travel

  Headline y las 2 fotos son 100% copy/assets fijos de marca -- no varían
  por cotización. Igual que "Creamos esta experiencia" y "Sobre nosotros".

  ASSETS ESTÁTICOS — ruta real: cotizaciones/static/cotizaciones/assets/
    logoEstrellaLusso.png  -> logo, esquina superior izquierda
    recuerdo1.png           -> foto horizontal, arriba/izquierda
    recuerdo2.png           -> foto superpuesta, abajo/derecha
-->

<section class="lusso-page lusso-page--recuerdo">

  <img class="r-logo" src="{% static 'cotizaciones/assets/logoEstrellaLusso.png' %}" alt="Lusso Travel">

  <h1 class="r-headline">¿Y si este<br>viaje es el<br>que recuerdes<br>toda tu vida?</h1>

  <img class="r-foto r-foto--1" src="{% static 'cotizaciones/assets/imagenFinal2.png' %}" alt="">
  <img class="r-foto r-foto--2" src="{% static 'cotizaciones/assets/imagenFinal3.png' %}" alt="">

</section>

<style>
  :root {
    --negro-editorial: #212222;
    --verde-pastel: #e3e6af;
    --azul-grisaceo: #a9bdd5;
    --crema: #fff6f4;
  }

  .lusso-page {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    page-break-after: always;
  }

  .lusso-page--recuerdo {
    background: var(--azul-grisaceo);
  }

  .r-logo {
    position: absolute;
    top: -100px;
    left: -20px;
    height: 700px;
  }

  .r-headline {
    position: absolute;
    top: 200px;
    left: 1280px;
    width: 480px;
    font-weight: 900;
    font-size: 85px;
    line-height: 0.8;
    letter-spacing: -7px;
    color: var(--crema);
    text-transform: uppercase;
    margin: 0;
    word-spacing: 10px;
  }

  /* Foto 1: horizontal amplia, arriba/izquierda */
  .r-foto--1 {
    position: absolute;
    top: 400px;
    left: 68px;
    width: 1100px;
    height: 530px;
    object-fit: cover;
    z-index: 1;
  }

  /* Foto 2: superpuesta, abajo/derecha de la primera, con borde para separarla visualmente */
  .r-foto--2 {
    position: absolute;
    top: 720px;
    left: 900px;
    width: 900px;
    height: 330px;
    object-fit: cover;
   
    z-index: 2;
  }
</style>
