{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!--
  BLOQUE: Página "Tus Vuelos" — Lusso Travel

  Cada vuelo es una CAPTURA DE PANTALLA inyectada (Avianca, Google Flights,
  etc.), no una tarjeta maquetada con CSS -- igual que en el PDF original.

  IMPORTANTE: usa un for-loop -- genera una fila por cada Vuelo
  asociado a la cotización, en el orden del campo 'orden'.

  CONTEXTO ESPERADO:
    cotizacion.destino     -> str
    cotizacion.vuelos.all  -> queryset de Vuelo, cada uno con:
        .get_tipo_display()  -> "Ida" / "Vuelta"
        .fecha                -> date
        .imagen                -> URL (Supabase Storage) de la captura

  ASSETS ESTÁTICOS:
    logoLargoNegro.png  -> logo oscuro (fondo claro)
-->

<section class="lusso-page lusso-page--vuelos">

  <div class="f-eyebrow">COLOMBIA &ndash; SUCRE &ndash; {{ cotizacion.destino|upper }}</div>
  <img class="f-logo" src="{% static 'cotizaciones/assets/logoLargoNegro.png' %}" alt="Lusso Travel">

  <h1 class="f-headline">Tus vuelos</h1>

  <img class="f-churito" src="{% static 'cotizaciones/assets/churito.png' %}" alt="">

  <div class="f-lista">
    {% for v in cotizacion.vuelos.all %}
      <img class="f-vuelo__captura" src="{{ v.imagen }}" alt="Vuelo {{ v.get_tipo_display }}">
    {% endfor %}
  </div>

</section>

<style>
  :root {
    --negro-editorial: #212222;
    --verde-pastel: #e3e6af;
    --azul-grisaceo: #a9bdd5;
    --crema: #fff6f4;
  }

  .lusso-page {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    page-break-after: always;
  }

  .lusso-page--vuelos {
    background: var(--verde-pastel);
  }

  .f-eyebrow {
    position: absolute;
    top: 100px;
    left: 68px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: var(--negro-editorial);
  }

  .f-logo {
    position: absolute;
    top: -10px;
    right: 80px;
    height: 260px;
  }

  .f-headline {
    position: absolute;
    top: 200px;
    left: 120px;
    font-weight: 900;
    font-size: 100px;
    letter-spacing: -2px;
    word-spacing: 8px;
    color: var(--negro-editorial);
    text-transform: uppercase;
    margin: 0;
  }

  .f-churito {
  position: absolute;
  top: -240px;
  left: 460px;
  width: 1400px;
}

  .f-lista {
    position: absolute;
    top: 400px;
    left: 50%;
    transform: translateX(-50%);
    width: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 70px;
  }

  .f-vuelo__captura {
  width: 90%;
  height: 220px;   /* ← agrega esta línea */
  object-fit: cover;   /* ← agrega esta también, para que no se deforme */
  border-radius: 8px;
  display: block;
}
</style>
