{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!--
  BLOQUE: Página 5 — "Tu viaje soñado" — Lusso Travel

  El headline y los subtítulos son texto vivo (cortos, una línea, importan
  bien a Canva). La intro y los párrafos largos bajo cada subtítulo ahora
  son IMÁGENES fijas -- evita que Canva rompa el espaciado al reimportar
  párrafos multilínea (ver diagnóstico: el importador de PDF de Canva
  segmenta texto largo de forma inconsistente, sin relación con el CSS
  de origen).

  CONTEXTO ESPERADO:
    cotizacion.destino             -> str
    cotizacion.imagen_viaje_sonado -> URL (Supabase Storage) foto horizontal

  ASSETS ESTÁTICOS — ruta real: cotizaciones/static/cotizaciones/assets/
    logoLargoNegro.png      -> logo oscuro (fondo claro)
    caraRedonda.png         -> elemento decorativo, esquina inferior derecha
    viajesonado_intro.png   -> "Al llegar a [destino]..." (imagen fija)
    viajesonado_texto1.png  -> párrafo bajo "Disfrutas cada instante" (imagen fija)
    viajesonado_texto2.png  -> párrafo bajo "Te llevas recuerdos inolvidables" (imagen fija)
-->

<section class="lusso-page lusso-page--viajesonado">

  <div class="v-eyebrow">COLOMBIA &ndash; SUCRE &ndash; {{ cotizacion.destino|upper }}</div>
  <img class="v-logo" src="{% static 'cotizaciones/assets/logoLargoNegro.png' %}" alt="Lusso Travel">

  <img class="v-photo" src="{{ cotizacion.imagen_viaje_sonado }}" alt="{{ cotizacion.destino }}">

  <div class="v-content">
    <h1 class="v-headline">Tu viaje<br>soñado</h1>

    <img class="v-intro-img" src="{% static 'cotizaciones/assets/viajesonado_intro.png' %}" alt="Al llegar a tu destino, te recibe la brisa del Caribe, el sonido de las olas y la tranquilidad de un destino perfecto para desconectarte de la rutina y comenzar a disfrutar.">

    <div class="v-block">
      <h2 class="v-subtitle">Disfrutas cada instante</h2>
      <img class="v-text-img" src="{% static 'cotizaciones/assets/viajesonado_texto1.png' %}" alt="Relájate frente al mar, contempla espectaculares amaneceres, recorre sus playas y comparte momentos únicos con quienes más quieres. Cada día está lleno de descanso, diversión y experiencias inolvidables.">
    </div>

    <div class="v-block">
      <h2 class="v-subtitle">Te llevas recuerdos inolvidables</h2>
      <img class="v-text-img" src="{% static 'cotizaciones/assets/viajesonado_texto2.png' %}" alt="Cuando llegue el momento de regresar, no solo llevarás fotografías, sino también la felicidad de haber vivido días llenos de tranquilidad, paisajes maravillosos y momentos que quedarán para siempre en tu memoria.">
    </div>
  </div>

  <img class="v-mancha" src="{% static 'cotizaciones/assets/caraRedonda.png' %}" alt="">

</section>

<style>
  :root {
    --negro-editorial: #212222;
    --verde-pastel: #e3e6af;
    --azul-grisaceo: #a9bdd5;
    --crema: #fff6f4;
  }

  .lusso-page {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    page-break-after: always;
  }

  .lusso-page--viajesonado {
    background: var(--crema);
  }

  .v-eyebrow {
    position: absolute;
    top: 100px;
    left: 68px;
    font-weight: 800;
    font-size: 25px;
    letter-spacing: 0.5px;
    color: var(--negro-editorial);
  }

  .v-logo {
    position: absolute;
    top: -10px;
    right: 80px;
    height: 260px;
  }

  .v-photo {
    position: absolute;
    top: 220px;
    left: 200px;
    width: 500px;
    height: 620px;
    object-fit: cover;
    border-radius: 4px;
  }

  .v-content {
    position: absolute;
    top: 220px;
    left: 900px;
    width: 780px;
  }

  .v-headline {
    font-weight: 900;
    font-size: 120px;
    line-height: 0.8;
    letter-spacing: -7px;
    color: var(--negro-editorial);
    text-transform: uppercase;
    margin: 0 0 24px 0;
  }

  .v-intro-img {
    display: block;
    width: 700px;
    margin: 80px 0 36px 0;
  }

  .v-block {
    margin-bottom: 28px;
  }

  .v-subtitle {
    font-weight: 850;
    font-size: 24px;
    color: var(--negro-editorial);
    margin: 0 0 8px 0;
  }

  .v-text-img {
    display: block;
    width: 700px;
  }

  .v-mancha {
    position: absolute;
    bottom: -120px;
    right: -120px;
    width: 550px;
  }
</style>
