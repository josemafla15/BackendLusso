{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!--
  BLOQUE: Página final "Buen viaje" — Lusso Travel

  Fechas/nombre/destino y datos de contacto -- TODOS rasterizados como
  PNG transparente, igual que el resto de textos largos del sistema,
  para evitar que Canva rompa el espaciado al reimportar.

  Fecha/nombre/destino usan flujo natural dentro de .bv-dates (mismo
  esquema que portada), no position:absolute individual.

  CONTEXTO ESPERADO:
    cotizacion.fecha_viaje_imagen           -> URL PNG (rango de fechas, compartida con portada)
    cotizacion.lead_nombre_imagen           -> URL PNG (nombre del cliente, compartida con portada)
    cotizacion.destino_buenviaje_imagen     -> URL PNG (destino, itálica, igual que portada)

  ASSETS ESTÁTICOS — ruta real: cotizaciones/static/cotizaciones/assets/
    logoApilado.png              -> logo crema (fondo oscuro)
    swirl_transparente.png       -> decorativo, esquina superior derecha, pegado al borde
    manchaVolteada.png           -> decorativo, esquina inferior derecha (capa de atrás)
    ventana.png                  -> decorativo, esquina inferior derecha (capa de adelante, sobre mancha)
    bv_contacto_telefono.png     -> "+57 320 550 9589" (imagen fija, no cambia)
    bv_contacto_instagram.png    -> "@lussotravelpasto" (imagen fija, no cambia)
    bv_contacto_email.png        -> "contacto@lussotravel.co" (imagen fija, no cambia)
-->

<section class="lusso-page lusso-page--buenviaje">

  <img class="bv-swirl" src="{% static 'cotizaciones/assets/swirl_transparente.png' %}" alt="">
  <img class="bv-mancha" src="{% static 'cotizaciones/assets/manchaVolteada.png' %}" alt="">
  <img class="bv-ventana" src="{% static 'cotizaciones/assets/ventana.png' %}" alt="">

  <img class="bv-logo" src="{% static 'cotizaciones/assets/logoApilado.png' %}" alt="Lusso Travel">

  <div class="bv-dates">
    <img class="bv-dates__range" src="{{ cotizacion.fecha_viaje_imagen }}" alt="">
    <img class="bv-dates__lead" src="{{ cotizacion.lead_nombre_imagen }}" alt="{% firstof cotizacion.nombre_cliente cotizacion.lead.nombre %}">
    <img class="bv-dates__destino" src="{{ cotizacion.destino_buenviaje_imagen }}" alt="{{ cotizacion.destino }}">
  </div>

  <h1 class="bv-headline">Buen<br>viaje</h1>

  <div class="bv-contacto">
    <img src="{% static 'cotizaciones/assets/bv_contacto_telefono.png' %}" alt="+57 320 550 9589">
    <img src="{% static 'cotizaciones/assets/bv_contacto_instagram.png' %}" alt="@lussotravelpasto">
    <img src="{% static 'cotizaciones/assets/bv_contacto_email.png' %}" alt="contacto@lussotravel.co">
  </div>

</section>

<style>
  :root {
    --negro-editorial: #212222;
    --verde-pastel: #e3e6af;
    --azul-grisaceo: #a9bdd5;
    --crema: #fff6f4;
  }

  .lusso-page {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  .lusso-page--buenviaje {
    background: var(--negro-editorial);
  }

  .bv-logo {
    position: absolute;
    top: 50px;
    left: 10px;
    height: 320px;
  }

  .bv-dates {
    position: absolute;
    top: 120px;
    right: 78px;
    text-align: right;
  }
  .bv-dates__range {
    display: block;
    margin-left: auto;
    height: 32px;
    width: auto;
  }
  .bv-dates__lead {
    display: block;
    margin-left: auto;
    margin-top: 4px;
    height: 32px;
    width: auto;
  }
  .bv-dates__destino {
    display: block;
    margin-left: auto;
    margin-top: -4px;
    height: 36px;
    width: auto;
  }

  .bv-headline {
    position: absolute;
    top: 300px;
    left: 60px;
    font-weight: 900;
    font-size: 250px;
    line-height: 0.78;
    letter-spacing: -9px;
    color: var(--crema);
    text-transform: uppercase;
    margin: 0;
  }

  .bv-contacto {
    position: absolute;
    bottom: 90px;
    left: 68px;
    display: flex;
    align-items: center;
    gap: 300px;
  }
  .bv-contacto img {
    height: 24px;
    width: auto;
  }

  /* Swirl pegado al borde superior derecho */
  .bv-swirl {
    position: absolute;
    top: -280px;
    right: 70px;
    width: 700px;
    transform: rotate(-45deg);
  }

  /* Mancha detrás de la ventana, esquina inferior derecha */
  .bv-mancha {
    position: absolute;
    bottom: -530px;
    right: -350px;
    width: 1100px;
  }
  .bv-ventana {
    position: absolute;
    bottom: 150px;
    right: -100px;
    width: 800px;
  }
</style>
