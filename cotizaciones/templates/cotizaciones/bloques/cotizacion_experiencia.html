{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<!--
  BLOQUE: Página "Tu experiencia" — Lusso Travel

  CONTEXTO ESPERADO:
    cotizacion.destino  -> str
    cotizacion.incluye  -> list de strings (JSONField, ya existía en el modelo)
                            Ej: ["Tiquetes ida y regreso desde Pasto",
                                 "3 noches en Hotel Ciela...", ...]

  Las líneas "Asistencia médica" y "Acompañamiento Lusso Travel" son
  CONSTANTES -- siempre aparecen, no vienen de ningún campo.

  ASSETS ESTÁTICOS — ruta real: cotizaciones/static/cotizaciones/assets/
    logoLargoNegro.png  -> logo oscuro (fondo claro)
    manchaBlanca.png    -> decorativo, esquina superior derecha
    churito.png         -> mismo asset reutilizado (rotado 90°), esquina superior izquierda
    carrito.png          -> ilustración del carro con maletas, lado izquierdo
-->

<section class="lusso-page lusso-page--experiencia">

  <img class="e-mancha" src="{% static 'cotizaciones/assets/machaBlanca.png' %}" alt="">
  <img class="e-churito" src="{% static 'cotizaciones/assets/churito.png' %}" alt="">

  <div class="e-eyebrow">COLOMBIA &ndash; SUCRE &ndash; {{ cotizacion.destino|upper }}</div>
  <img class="e-logo" src="{% static 'cotizaciones/assets/logoLargoNegro.png' %}" alt="Lusso Travel">

  <h1 class="e-headline">Tu experiencia</h1>

  <img class="e-carrito" src="{% static 'cotizaciones/assets/carrito.png' %}" alt="">

  <div class="e-contenido">
    <h2 class="e-subtitulo">Incluye:</h2>
    <ul class="e-lista">
      {% for item in cotizacion.incluye %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>

    <div class="e-constante">Asistencia médica</div>
    <div class="e-constante">Acompañamiento Lusso Travel</div>
  </div>

</section>

<style>
  :root {
    --negro-editorial: #212222;
    --verde-pastel: #e3e6af;
    --azul-grisaceo: #a9bdd5;
    --crema: #fff6f4;
  }

  .lusso-page {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    page-break-after: always;
  }

  .lusso-page--experiencia {
    background: var(--azul-grisaceo);
  }

  .e-mancha {
    position: absolute;
    top: -1150px;
    right: -700px;
    width: 1600px;
    
  }

  .e-churito {
    position: absolute;
    top: -570px;
    left: -610px;
    width: 1400px;
    transform: rotate(270deg);
  }

  .e-eyebrow {
    position: absolute;
    top: 100px;
    left: 68px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: var(--negro-editorial);
  }

  .e-logo {
    position: absolute;
    top: -10px;
    right: 80px;
    height: 260px;
  }

  .e-headline {
    position: absolute;
    top: 150px;
    left: 68px;
    font-weight: 900;
    font-size: 120px;
    letter-spacing: -9px;
    color: var(--crema);
    text-transform: uppercase;
    margin: 0;
  }

  .e-carrito {
    position: absolute;
    top: 370px;
    left: 175px;
    width: 650px;
  }

  .e-contenido {
    position: absolute;
    top: 350px;
    left: 970px;
    width: 700px;
  }

  .e-subtitulo {
    font-weight: 700;
    font-size: 35px;
    color: var(--negro-editorial);
    margin: 0 0 16px 0;
  }

  .e-lista {
    list-style: none;
    margin: 0 0 32px 40px;
    padding: 0;
  }
  .e-lista li {
    position: relative;
    padding-left: 28px;
    font-weight: 600;
    font-size: 25px;
    line-height: 1.4;
    color: var(--negro-editorial);
    margin-bottom: 14px;
  }
  .e-lista li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--negro-editorial);
  }

  .e-constante {
    font-weight: 900;
    font-size: 33px;
    color: var(--negro-editorial);
    margin-bottom: 10px;
  }
</style>
